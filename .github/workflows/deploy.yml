# ==========================================================================
# نشر تلقائي على الاستضافة (cPanel) عبر FTP، بدون أي حاجة لصلاحية SSH.
#
# كل مرة يوصل تعديل لفرع main (Push مباشر، أو دمج Pull Request)، هاد
# الملف بيشغّل تلقائيًا على سيرفرات جيت هاب (مو على جهازك ولا على
# الاستضافة)، وبيعمل خطوتين بالتوازي:
#
#   1) يرفع محتوى مجلد frontend/ مباشرة لمجلد public_html على السيرفر.
#   2) يجهّز مكتبات الباك إند (composer install) على سيرفر جيت هاب نفسه،
#      وبعدين يرفع النتيجة كاملة (بما فيها vendor/) لمجلد ptc-hub-backend.
#
# ملف .env الحقيقي على السيرفر ما يتلمس إطلاقًا (مو موجود بالريبو أصلًا)،
# وكل الملفات المؤقتة (سجلات، جلسات، كاش) مستثناة صراحة حتى ما ينمسح
# أو ينكتب فوقها أي شي شغّال فعليًا على الموقع المباشر.
# ==========================================================================

name: نشر الموقع تلقائيًا

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy-frontend:
    name: نشر الواجهة (frontend → public_html)
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل نسخة من الكود
        uses: actions/checkout@v4

      - name: رفع frontend عبر FTP إلى public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./frontend/
          server-dir: ./public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**

  deploy-backend:
    name: نشر الباك إند (backend → ptc-hub-backend)
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل نسخة من الكود
        uses: actions/checkout@v4

      - name: تجهيز PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: تثبيت مكتبات Composer (بدون مكتبات التطوير)
        working-directory: ./backend
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: رفع backend عبر FTP إلى ptc-hub-backend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./backend/
          server-dir: ./ptc-hub-backend/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .env
            .env.local
            storage/logs/**
            storage/framework/sessions/**
            storage/framework/views/**
            storage/framework/cache/**
            storage/framework/testing/**
            storage/app/public/**
            storage/app/private/**
            bootstrap/cache/*.php
