services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ptc_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ptc_postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

volumes:
  ptc_postgres:
